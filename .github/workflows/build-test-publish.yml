name: Build, Test, and Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      # gofmt treats CRLF line endings as formatting differences. Disable Git's
      # automatic conversion before checkout so the Windows runner checks out
      # the same LF bytes as Linux.
      - name: Configure Git line endings
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/.*const version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' cmd/tcpdiag/main.go | head -n1)"
          if [[ -z "$version" ]]; then
            echo "Could not read the tcpdiag version from cmd/tcpdiag/main.go" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag version ${GITHUB_REF_NAME#v} does not match source version $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build archive
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package="tcpdiag_${VERSION}_${GOOS}_${GOARCH}"
          package_dir="dist/$package"
          binary="tcpdiag"
          if [[ "$GOOS" == "windows" ]]; then
            binary="tcpdiag.exe"
          fi

          mkdir -p "$package_dir"
          go build -trimpath -ldflags="-s -w" -o "$package_dir/$binary" ./cmd/tcpdiag
          cp README.md "$package_dir/"

          if [[ "$GOOS" == "windows" ]]; then
            (cd dist && zip -qr "$package.zip" "$package")
          else
            (cd dist && tar -czf "$package.tar.gz" "$package")
          fi

          rm -rf "$package_dir"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: tcpdiag-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tcpdiag_*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: tcpdiag-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum tcpdiag_* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GH_REPO" \
              --title "tcpdiag $TAG" \
              --generate-notes
          fi
